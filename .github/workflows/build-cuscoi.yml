name: Build EDK2-msm for Motorola Edge 50 Fusion (cuscoi)

on:
  workflow_dispatch:
  push:
    paths:
      - 'Silicon/Qualcomm/sm7435/**'
      - 'Platform/Motorola/sm7435/**'
      - 'configs/sm7435.conf'
      - 'configs/devices/cuscoi.conf'
      - '.github/workflows/build-cuscoi.yml'

jobs:
  build:
    name: Build cuscoi UEFI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Install required packages
        run: |
          sudo dpkg --add-architecture i386
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo wget -O /etc/apt/keyrings/winehq-archive.key \
            https://dl.winehq.org/wine-builds/winehq.key
          sudo chmod 644 /etc/apt/keyrings/winehq-archive.key
          sudo wget -O /etc/apt/sources.list.d/winehq-noble.sources \
            https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update
          sudo apt-get install --install-recommends winehq-stable libsdl2-2.0-0 libsdl2-dev build-essential uuid-dev clang llvm iasl nasm gcc-aarch64-linux-gnu abootimg python3-pil python3-git gettext libgcc-s1:i386 libstdc++6:i386 device-tree-compiler -y

      - name: Build UEFI boot image for cuscoi
        run: |
          chmod +x ./build.sh
          ./build.sh --device cuscoi --release RELEASE

      - name: Upload boot-cuscoi.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot-cuscoi
          path: ./boot-cuscoi.img
